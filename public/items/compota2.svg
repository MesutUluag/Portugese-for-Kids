<svg xmlns="http://www.w3.org/2000/svg" viewBox="240 135 325 370">
  <defs>
    <!-- Soft Studio Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5F0E6"/>
      <stop offset="100%" stop-color="#E2D5C4"/>
    </radialGradient>

    <!-- Drop Shadows & Blurs -->
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Jam (Compota) Rich Color Gradients -->
    <radialGradient id="jamBody" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FF1744"/>    <!-- Bright center glow -->
      <stop offset="35%" stop-color="#D50000"/>   <!-- Rich red -->
      <stop offset="75%" stop-color="#880E4F"/>   <!-- Deep maroon -->
      <stop offset="100%" stop-color="#3E0018"/>  <!-- Very dark edge -->
    </radialGradient>

    <radialGradient id="jamHighlight" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF5252" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5252" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Cylinder Shading -->
    <linearGradient id="glassShading" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="8%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="95%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Gingham Fabric Pattern (Kareli Kumaş Deseni) -->
    <pattern id="gingham" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <rect width="30" height="30" fill="#FDFDFD"/>
      <rect width="15" height="15" fill="#C62828" fill-opacity="0.85"/>
      <rect x="15" y="15" width="15" height="15" fill="#C62828" fill-opacity="0.85"/>
      <rect x="15" y="0" width="15" height="15" fill="#C62828" fill-opacity="0.45"/>
      <rect x="0" y="15" width="15" height="15" fill="#C62828" fill-opacity="0.45"/>
    </pattern>

    <!-- Cylinder Shading for the Lid Skirt -->
    <linearGradient id="lidShading" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="15%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- ==================== BASE SHADOW ==================== -->
  <ellipse cx="400" cy="485" rx="155" ry="24" fill="#291E16" opacity="0.4" filter="url(#shadowBlur)"/>
  <ellipse cx="400" cy="485" rx="110" ry="12" fill="#1A100A" opacity="0.3" filter="url(#softBlur)"/>

  <!-- ==================== THE COMPOTA JAR ==================== -->
  <g id="jar">
    <!-- Jam Body Core Shape -->
    <path d="M 295 210 
             C 270 230, 250 260, 250 320 
             L 250 430 
             C 250 475, 300 490, 400 490 
             C 500 490, 550 475, 550 430 
             L 550 320 
             C 550 260, 530 230, 505 210 Z" 
          fill="url(#jamBody)"/>
    
    <!-- Internal Jam Ambient Glow -->
    <path d="M 295 210 C 270 230, 250 260, 250 320 L 250 430 C 250 475, 300 490, 400 490 C 500 490, 550 475, 550 430 L 550 320 C 550 260, 530 230, 505 210 Z" 
          fill="url(#jamHighlight)" opacity="0.75"/>

    <!-- Fruit Chunks Suspended in Jam (Giving it realistic texture) -->
    <g opacity="0.45" filter="url(#softBlur)">
      <ellipse cx="320" cy="300" rx="25" ry="15" fill="#3E0018"/>
      <ellipse cx="480" cy="350" rx="35" ry="20" fill="#3E0018"/>
      <ellipse cx="380" cy="440" rx="30" ry="15" fill="#1A0008"/>
      <ellipse cx="280" cy="400" rx="20" ry="25" fill="#3E0018"/>
      <ellipse cx="450" cy="270" rx="25" ry="15" fill="#1A0008"/>
      <ellipse cx="370" cy="250" rx="30" ry="18" fill="#4A0010"/>
    </g>

    <!-- Glass 3D Cylinder Shading Overlay -->
    <path d="M 295 210 C 270 230, 250 260, 250 320 L 250 430 C 250 475, 300 490, 400 490 C 500 490, 550 475, 550 430 L 550 320 C 550 260, 530 230, 505 210 Z" 
          fill="url(#glassShading)"/>

    <!-- Crisp Glass Edge Highlights -->
    <!-- Left Curve Highlight -->
    <path d="M 265 320 L 265 420 C 265 450, 290 465, 310 472 L 315 465 C 290 455, 275 440, 275 420 L 275 320 C 275 275, 290 255, 305 242 L 295 235 C 280 250, 265 270, 265 320 Z" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Right Curve Subtle Highlight -->
    <path d="M 535 320 L 535 420 C 535 450, 510 465, 490 472 L 485 465 C 510 455, 525 440, 525 420 L 525 320 C 525 275, 510 255, 495 242 L 505 235 C 520 250, 535 270, 535 320 Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- Bottom Rim Thick Glass Base -->
    <path d="M 290 478 C 340 495, 460 495, 510 478 L 515 482 C 460 502, 340 502, 285 482 Z" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- ==================== THE LABEL ==================== -->
  <g id="label" transform="translate(0, 10)">
    <!-- Label Drop Shadow -->
    <rect x="310" y="250" width="180" height="140" rx="15" fill="#3E0018" opacity="0.35" filter="url(#softBlur)"/>
    
    <!-- Label Base (Creamy Vintage Paper) -->
    <rect x="310" y="250" width="180" height="140" rx="15" fill="#FFFBF0"/>
    
    <!-- Double Gold Borders -->
    <rect x="316" y="256" width="168" height="128" rx="12" fill="none" stroke="#C5A059" stroke-width="2"/>
    <rect x="320" y="260" width="160" height="120" rx="9" fill="none" stroke="#C5A059" stroke-width="0.75"/>
    
    <!-- Label Typography & Art -->
    <text x="400" y="295" font-family="Georgia, serif" font-size="24" font-weight="900" letter-spacing="1.5" fill="#3E2723" text-anchor="middle">COMPOTA</text>
    <text x="400" y="325" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#795548" text-anchor="middle">de Morango</text>
    <text x="400" y="375" font-family="Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="2" fill="#A1887F" text-anchor="middle">100% ARTESANAL</text>

    <!-- Tiny Strawberry Illustration on Label -->
    <g transform="translate(400, 345) scale(0.7)">
      <path d="M 0 -8 C 12 -8, 18 5, 12 18 C 6 28, 0 35, 0 35 C 0 35, -6 28, -12 18 C -18 5, -12 -8, 0 -8 Z" fill="#D32F2F"/>
      <path d="M 0 -8 L -6 -14 L 0 -11 L 6 -14 Z" fill="#2E7D32"/>
      <circle cx="-5" cy="5" r="1" fill="#FFC107"/>
      <circle cx="5" cy="5" r="1" fill="#FFC107"/>
      <circle cx="0" cy="15" r="1" fill="#FFC107"/>
    </g>
  </g>

  <!-- ==================== FABRIC COVER & LID ==================== -->
  <g id="lid">
    <!-- Frilled Fabric Skirt -->
    <path d="M 270 170 C 270 170, 260 230, 275 235 C 290 240, 305 220, 310 235 C 315 250, 330 235, 340 245 C 350 255, 370 230, 385 245 C 400 260, 420 230, 430 245 C 440 255, 460 230, 475 245 C 490 260, 505 235, 520 245 C 535 255, 545 220, 545 220 L 545 170 Z" fill="url(#gingham)"/>
    <path d="M 270 170 C 270 170, 260 230, 275 235 C 290 240, 305 220, 310 235 C 315 250, 330 235, 340 245 C 350 255, 370 230, 385 245 C 400 260, 420 230, 430 245 C 440 255, 460 230, 475 245 C 490 260, 505 235, 520 245 C 535 255, 545 220, 545 220 L 545 170 Z" fill="url(#lidShading)"/>

    <!-- Tie String (Twine) -->
    <path d="M 271 210 C 270 235, 530 235, 529 210" fill="none" stroke="#D7CCC8" stroke-width="4"/>
    <path d="M 271 210 C 270 235, 530 235, 529 210" fill="none" stroke="#A1887F" stroke-width="1.5" stroke-dasharray="3,2"/>
    
    <!-- Twine Bow (Tied closely to the jar) -->
    <g transform="translate(400, 222)">
      <!-- Loops -->
      <path d="M 0 0 C -25 -20, -40 10, -5 2 Z" fill="none" stroke="#D7CCC8" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0 0 C 25 -20, 40 10, 5 2 Z" fill="none" stroke="#D7CCC8" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0 0 C -25 -20, -40 10, -5 2 Z" fill="none" stroke="#A1887F" stroke-width="1" stroke-dasharray="2,2"/>
      <path d="M 0 0 C 25 -20, 40 10, 5 2 Z" fill="none" stroke="#A1887F" stroke-width="1" stroke-dasharray="2,2"/>
      <!-- Tails -->
      <path d="M -3 1 L -20 25 M 3 1 L 20 25" stroke="#D7CCC8" stroke-width="3" stroke-linecap="round"/>
      <path d="M -3 1 L -20 25 M 3 1 L 20 25" stroke="#A1887F" stroke-width="1" stroke-dasharray="2,2"/>
      <!-- Knot -->
      <circle cx="0" cy="0" r="4" fill="#D7CCC8"/>
    </g>

    <!-- Top Oval Fabric Cap -->
    <ellipse cx="400" cy="170" rx="135" ry="32" fill="url(#gingham)"/>
    <ellipse cx="400" cy="170" rx="135" ry="32" fill="#FFFFFF" opacity="0.15"/>
    <ellipse cx="400" cy="170" rx="135" ry="32" fill="none" stroke="#C62828" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
