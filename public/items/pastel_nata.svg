<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" height="100" width="100" preserveAspectRatio="xMidYMid meet">
  <defs>

    <!-- Pastry body: golden top shading to deep brown base -->
    <linearGradient id="pn-body" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#e8951a"/>
      <stop offset="30%"  stop-color="#c97015"/>
      <stop offset="65%"  stop-color="#9a4a08"/>
      <stop offset="100%" stop-color="#5c2404"/>
    </linearGradient>

    <!-- Pastry front face: cylindrical shading -->
    <linearGradient id="pn-front" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4a1c04" stop-opacity="1"/>
      <stop offset="12%"  stop-color="#d4780e" stop-opacity="0.9"/>
      <stop offset="35%"  stop-color="#f0a820" stop-opacity="0.7"/>
      <stop offset="55%"  stop-color="#e8981a" stop-opacity="0.65"/>
      <stop offset="78%"  stop-color="#b85c0a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4a1c04" stop-opacity="1"/>
    </linearGradient>

    <!-- Top rim face -->
    <linearGradient id="pn-rim-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7a3408"/>
      <stop offset="30%"  stop-color="#e8a020"/>
      <stop offset="55%"  stop-color="#f5c040"/>
      <stop offset="80%"  stop-color="#d08010"/>
      <stop offset="100%" stop-color="#7a3408"/>
    </linearGradient>

    <!-- Custard surface: creamy yellow with warm amber -->
    <radialGradient id="pn-custard" cx="42%" cy="38%" r="60%">
      <stop offset="0%"   stop-color="#f8e060"/>
      <stop offset="25%"  stop-color="#f0c030"/>
      <stop offset="55%"  stop-color="#e09018"/>
      <stop offset="80%"  stop-color="#c06010"/>
      <stop offset="100%" stop-color="#8c3806"/>
    </radialGradient>

    <!-- Custard gloss: strong specular highlight -->
    <radialGradient id="pn-gloss" cx="32%" cy="28%" r="42%">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0.72"/>
      <stop offset="45%"  stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Custard rim shadow -->
    <radialGradient id="pn-rim-shad" cx="50%" cy="50%" r="50%">
      <stop offset="58%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Ground drop shadow -->
    <radialGradient id="pn-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Mottled pastry texture filter -->
    <filter id="pn-rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Clip custard to top opening ellipse -->
    <clipPath id="pn-cust-clip">
      <ellipse cx="50" cy="36" rx="28" ry="11"/>
    </clipPath>

  </defs>

  <!-- ── Drop shadow ── -->
  <ellipse cx="50" cy="69" rx="30" ry="4" fill="url(#pn-shadow)"/>

  <!-- ═══════════════════════════════════
       PASTRY CUP — shorter cylindrical body
  ═══════════════════════════════════ -->

  <!-- Cup bottom ellipse (dark underside) -->
  <ellipse cx="50" cy="64" rx="29" ry="6" fill="#3a1404"/>

  <!-- Main cup body -->
  <path d="
    M21 50
    C18 54  18 59  20 62
    C24 68  36 72  50 72
    C64 72  76 68  80 62
    C82 59  82 54  79 50
    C70 44  61 41  50 41
    C39 41  30 44  21 50
    Z"
    fill="url(#pn-body)"/>

  <!-- Front cylindrical shading overlay -->
  <path d="
    M21 50
    C18 54  18 59  20 62
    C24 68  36 72  50 72
    C64 72  76 68  80 62
    C82 59  82 54  79 50
    C70 44  61 41  50 41
    C39 41  30 44  21 50
    Z"
    fill="url(#pn-front)" opacity="0.6"/>

  <!-- Pastry mottling / baked texture blobs -->
  <ellipse cx="28" cy="57" rx="5" ry="4" fill="#7a3208" opacity="0.35" filter="url(#pn-rough)"/>
  <ellipse cx="72" cy="58" rx="4" ry="4" fill="#7a3208" opacity="0.30"/>
  <ellipse cx="50" cy="65" rx="8" ry="3" fill="#5a2006" opacity="0.28"/>
  <ellipse cx="36" cy="53" rx="4" ry="3" fill="#9a4808" opacity="0.25"/>
  <ellipse cx="64" cy="53" rx="3.5" ry="3" fill="#9a4808" opacity="0.22"/>

  <!-- Dark caramelised streaks on pastry sides -->
  <path d="M24 52 C22 57 22 62 23 63" fill="none" stroke="#3a1006" stroke-width="2.5" opacity="0.40" stroke-linecap="round"/>
  <path d="M32 46 C30 53 30 60 31 63" fill="none" stroke="#5a2006" stroke-width="1.8" opacity="0.30" stroke-linecap="round"/>
  <path d="M50 43 C50 51 50 60 50 66" fill="none" stroke="#4a1806" stroke-width="1.5" opacity="0.20" stroke-linecap="round"/>
  <path d="M68 46 C70 53 70 60 69 63" fill="none" stroke="#5a2006" stroke-width="1.8" opacity="0.30" stroke-linecap="round"/>
  <path d="M76 52 C78 57 78 62 77 63" fill="none" stroke="#3a1006" stroke-width="2.5" opacity="0.40" stroke-linecap="round"/>

  <!-- Horizontal lamination lines -->
  <path d="M20 54 Q50 51 80 54" fill="none" stroke="#c07018" stroke-width="1.4" opacity="0.35"/>
  <path d="M19 59 Q50 57 81 59" fill="none" stroke="#8a3808" stroke-width="1.2" opacity="0.32"/>
  <path d="M19 64 Q50 62 81 64" fill="none" stroke="#6a2806" stroke-width="1.1" opacity="0.30"/>

  <!-- ═══════════════════════════════════
       RIM — top opening ring
  ═══════════════════════════════════ -->

  <!-- Outer rim ellipse -->
  <ellipse cx="50" cy="44" rx="30" ry="10" fill="#b86010"/>
  <!-- Rim top face -->
  <ellipse cx="50" cy="42.5" rx="29" ry="9.5" fill="url(#pn-rim-top)"/>
  <!-- Inner rim lip -->
  <ellipse cx="50" cy="41.5" rx="27.5" ry="8.5" fill="#d47818"/>
  <!-- Rim shadow inset -->
  <ellipse cx="50" cy="41" rx="26" ry="8" fill="#3a1006" opacity="0.35"/>

  <!-- ═══════════════════════════════════
       CUSTARD FILLING — wobbly glossy top
  ═══════════════════════════════════ -->

  <!-- Custard base fill -->
  <ellipse cx="50" cy="39" rx="25" ry="10.5" fill="url(#pn-custard)"/>

  <!-- Wobbly custard surface undulations (irregular rim ripples) -->
  <path d="
    M25 39
    C27 35  31 33  35 36
    C37 37.5 39 34  42 33
    C45 32  47 35  50 34
    C53 33  55 31  58 33
    C61 35  63 33  66 35
    C69 37  72 39  75 39
    C72 43  66 45  58 46
    C53 47  50 45  46 46
    C42 47  38 45  33 44
    C29 43  25 43  25 39
    Z"
    fill="url(#pn-custard)" opacity="0.9"/>

  <!-- ── Heavy burnt caramel patches (as in photo) ── -->

  <!-- Central dark burnt blob — top centre -->
  <path d="M46 33 C50 30 56 30.5 59 33.5 C61 36 59 39 55 40
           C51 41 47 39 45.5 36.5 C44.5 34.5 45 33.5 46 33 Z"
        fill="#180400" opacity="0.78"/>

  <!-- Secondary burnt area — right of centre -->
  <path d="M57 34 C61 32.5 66 34 67.5 37
           C68.5 39.5 66.5 42 63 42.5
           C59.5 43 56.5 41 56 38
           C55.5 35.5 56 34.5 57 34 Z"
        fill="#200600" opacity="0.68"/>

  <!-- Left burnt patch -->
  <path d="M31 36 C34 33.5 39 35 40.5 38
           C41.5 40.5 39.5 43 36.5 43.5
           C33.5 44 30.5 42 30 39
           C29.5 37 30.5 36.5 31 36 Z"
        fill="#1a0400" opacity="0.65"/>

  <!-- Small scattered dark spots -->
  <ellipse cx="50" cy="31"   rx="3.2" ry="1.6" fill="#200800" opacity="0.55"/>
  <ellipse cx="61" cy="30.5" rx="2.4" ry="1.2" fill="#280a00" opacity="0.48"/>
  <ellipse cx="39" cy="31"   rx="2.0" ry="1.0" fill="#200800" opacity="0.45"/>
  <ellipse cx="66" cy="36"   rx="2.0" ry="1.0" fill="#200600" opacity="0.42" transform="rotate(-10 66 36)"/>
  <ellipse cx="33" cy="40"   rx="1.8" ry="0.9" fill="#1c0600" opacity="0.42"/>
  <ellipse cx="55" cy="43"   rx="2.5" ry="1.0" fill="#200800" opacity="0.40"/>
  <!-- Dark rim streak at front -->
  <path d="M36 44.5 C42 43 50 43.5 60 44" fill="none" stroke="#1a0600"
        stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>

  <!-- Custard glossy sheen (wet look) -->
  <ellipse cx="50" cy="38" rx="25" ry="10.5" fill="url(#pn-rim-shad)"/>

  <!-- Specular gloss highlight — strong, top-left (matching photo reflection) -->
  <path d="M32 32 C36 29 45 29.5 50 32 C48 36 40 37.5 34 36 Z"
        fill="url(#pn-gloss)" opacity="0.85"/>
  <!-- Secondary soft highlight -->
  <ellipse cx="44" cy="30.5" rx="5.5" ry="2.2"
    fill="#fff" opacity="0.28" transform="rotate(-12 44 30.5)"/>
  <!-- Tiny catchlight -->
  <ellipse cx="37" cy="29.5" rx="2.5" ry="1.0"
    fill="#fff" opacity="0.45" transform="rotate(-8 37 29.5)"/>

</svg>
