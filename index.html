<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fun and interactive app for kids to learn Portuguese through games, stories, and flashcards." />
    <title>Learn Portuguese - Kids Playground 🎈</title>
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || navigator.vendor || (window.opera ? '' + window.opera : '');
          var isAndroid = /android/i.test(ua);
          var isInApp = /WhatsApp|FBAN|FBAV|Instagram|Line/i.test(ua);
          // Android WhatsApp durumunda doğrudan Chrome intent'i tetikle
          if (isAndroid && isInApp) {
            var targetUrl = window.location.href.replace(/^https?:\/\//, '');
            window.location.href = 'intent://' + targetUrl + '#Intent;scheme=https;package=com.android.chrome;end';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
